exclude = [
    ".ebextensions",
    ".git",
    ".idea",
    ".platform",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    "__pycache__",
    "*-local.py",
    "layers",
    "venv"
]
line-length = 150
indent-width = 4

# Python version
target-version = "py313"

[lint]
select = ['ALL']

# TODO: Rules we want to enable:
# BLE001, TRY401

# Rules to ignore
ignore = [
    "ANN", "ANN202", "ARG001", "B023", "B904", "B905", "BLE001", "C401", "C402", "C403", "C408", "C416", "C417", "D10", "D203",
    "D211", "D212", "D213", "DTZ", "E731", "EM101", "EM102", "FBT002", "FBT003", "FIX002", "FLY002", "G004", "ICN001",
    "INP001", "PERF401", "PIE804", "PLC0206", "PLC0415", "PLC1802", "PLR1736", "PLR2004", "PLR5501", "PLW0603",
    "PLW2901", "PTH", "Q000", "RET503", "RET505", "RET506", "RUF005", "RUF012", "S101", "S108", "S311", "S603", "S608",
    "SIM102", "SIM108", "SIM115", "SIM401", "SLF001", "TD002", "TD003", "TRY003", "TRY201", "TRY300", "TRY401", "UP012", "UP015",
    "UP028", "W605"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.flake8-copyright]
notice-rgx = "(?i)Copyright ©\\d{4}. The Regents of the University of California \\(Regents\\). All Rights Reserved."

[lint.flake8-quotes]
inline-quotes = "single"

[lint.pylint]
max-args = 8
max-branches = 19
max-returns = 8
max-statements = 60

[lint.mccabe]
max-complexity = 12

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
